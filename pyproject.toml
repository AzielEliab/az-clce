[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "az-clce"
version = "0.1.0"
description = "AZ-CLCE: Cross-Layer Consistency Engine. Detects inconsistency across R, D, and P. Not intent, not a scanner, not a lie detector."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "consistency",
    "jaccard",
    "cross-layer",
    "documentation",
    "validation",
    "clce",
    "advisory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
clce = "clce.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/az-clce"
Download = "https://github.com/AzielEliab/az-clce/releases"
Issues = "https://github.com/AzielEliab/az-clce/issues"
Counted-downloads = "https://azclce-download-tracker.vibelock.workers.dev/"

[tool.setuptools.packages.find]
include = ["clce*"]

[tool.setuptools.package-data]
clce = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
